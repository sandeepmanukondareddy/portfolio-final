<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin</title>

    <!-- Netlify Identity (required for Git Gateway login + recovery links) -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  </head>

  <body>
    <!-- Decap CMS -->
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

    <script>
      // Handle login + recovery flows inside /admin
      if (window.netlifyIdentity) {
        window.netlifyIdentity.on("init", (user) => {
          // If not logged in, stay on admin (shows login)
          if (!user) {
            window.netlifyIdentity.on("login", () => {
              document.location.href = "/admin/";
            });
          }
        });

        // Initialize Identity (this is what processes recovery_token links)
        window.netlifyIdentity.init();
      }
    </script>
  </body>
</html>
